type: object
required:
  - user_uuid
  - part_uuids
properties: 
  user_uuid:
    type: string
    format: uuid
    description: Уникальный идентификатор пользователя
  part_uuids:
    type: array
    minItems: 1
    uniqueItems: true
    description: Список уникальных идентификаторов деталей
    items:
      type: string
      format: uuid
      description: Список уникальных идентификаторов деталей